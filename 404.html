<script>
(function(){
  try{
    if(!localStorage.getItem('pcb_cookie_ack')){
      document.addEventListener('DOMContentLoaded', function(){
        var bar = document.getElementById('pcb-cookie-bar');
        if(bar) bar.style.display = 'flex';
      });
    }
    document.addEventListener('click', function(e){
      if(e.target && e.target.id === 'pcb-cookie-ok'){
        localStorage.setItem('pcb_cookie_ack', '1');
        document.getElementById('pcb-cookie-bar').style.display = 'none';
      }
    });
  }catch(err){}

  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href^="tel:"]');
    if(a && window.dataLayer){
      window.dataLayer.push({event:'phone_click', phone_number:a.getAttribute('href').replace('tel:','')});
    }
  });
})();
</script>
